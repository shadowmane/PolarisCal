[workspace]
resolver = "3"
members = ["src-tauri", "crates/polaris-core", "crates/polaris-store"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/shadowmane/PolarisCal"

[workspace.dependencies]
polaris-core = { path = "crates/polaris-core" }
polaris-store = { path = "crates/polaris-store" }

argon2 = "0.6.0"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "macros", "migrate", "chrono"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
