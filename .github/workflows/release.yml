name: Release

# Push a tag such as v0.2.0 (matching the version in Cargo.toml) to build the
# Windows installers and the signed update files. They're attached to a draft
# GitHub release; publishing the draft makes it the version PolarisCal updates to.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="polariscal") | .version')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the version in Cargo.toml (v$version)."
            exit 1
          fi

      # Builds the .msi and NSIS .exe, signs the update bundles with the updater key,
      # and uploads everything (plus latest.json for the updater) to a draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: PolarisCal v__VERSION__
          releaseBody: See the commits since the previous release for what changed.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
