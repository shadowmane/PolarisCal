[package]
name = "polariscal"
description = "PolarisCal calibration tracking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# matters on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "polariscal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
polaris-core.workspace = true
polaris-store.workspace = true
serde.workspace = true
serde_json.workspace = true
mime_guess = "2.0.5"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror.workspace = true
ts-rs.workspace = true
rust_xlsxwriter = "0.103"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
