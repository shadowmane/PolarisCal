[package]
name = "polariscal"
description = "PolarisCal calibration tracking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# matters on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "polariscal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
polaris-core.workspace = true
polaris-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
ts-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true
